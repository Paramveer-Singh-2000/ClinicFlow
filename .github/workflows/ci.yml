name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ClinicFlow.slnx

      - name: Build solution
        run: dotnet build ClinicFlow.slnx --no-restore --configuration Release

      - name: Run tests
        run: dotnet test ClinicFlow.Tests/ClinicFlow.Tests.csproj --configuration Release --no-build --verbosity normal
