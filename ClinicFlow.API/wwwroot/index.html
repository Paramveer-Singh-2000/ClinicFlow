<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bright Smile Dental — AI Receptionist</title>
    <style>
        :root {
            --bg: #0f1117;
            --panel: #171a23;
            --line: #262b38;
            --text: #e6e8ee;
            --muted: #8b93a7;
            --accent: #4f8ef7;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app {
            width: 100%;
            max-width: 720px;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            padding: 18px 20px;
            border-bottom: 1px solid var(--line);
        }

            header h1 {
                margin: 0;
                font-size: 17px;
                font-weight: 600;
            }

            header p {
                margin: 3px 0 0;
                font-size: 13px;
                color: var(--muted);
            }

        #log {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .msg {
            max-width: 78%;
            padding: 10px 14px;
            border-radius: 14px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .user {
            align-self: flex-end;
            background: var(--accent);
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .bot {
            align-self: flex-start;
            background: var(--panel);
            border: 1px solid var(--line);
            border-bottom-left-radius: 4px;
        }

        .typing {
            color: var(--muted);
            font-style: italic;
        }

        .composer {
            display: flex;
            gap: 10px;
            padding: 16px 20px;
            border-top: 1px solid var(--line);
        }

        input {
            flex: 1;
            padding: 11px 14px;
            border-radius: 10px;
            border: 1px solid var(--line);
            background: var(--panel);
            color: var(--text);
            font: inherit;
        }

            input:focus {
                outline: none;
                border-color: var(--accent);
            }

        button {
            padding: 11px 20px;
            border: 0;
            border-radius: 10px;
            background: var(--accent);
            color: #fff;
            font: inherit;
            font-weight: 500;
            cursor: pointer;
        }

            button:disabled {
                opacity: .5;
                cursor: default;
            }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 0 20px 14px;
        }

        .chip {
            font-size: 13px;
            padding: 6px 12px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: transparent;
            color: var(--muted);
            cursor: pointer;
        }

            .chip:hover {
                border-color: var(--accent);
                color: var(--text);
            }
    </style>
</head>
<body>
    <div class="app">
        <header>
            <h1>Bright Smile Dental</h1>
            <p>AI receptionist — book, check, or cancel an appointment</p>
        </header>

        <div id="log"></div>

        <div class="chips" id="chips">
            <button class="chip">Can I get a cleaning next Tuesday afternoon?</button>
            <button class="chip">I have a toothache, what's the soonest I can come in?</button>
            <button class="chip">Who works on Wednesdays?</button>
        </div>

        <div class="composer">
            <input id="input" placeholder="Type a message…" autocomplete="off">
            <button id="send">Send</button>
        </div>
    </div>

    <script>
                const log = document.getElementById('log');
                const input = document.getElementById('input');
                const send = document.getElementById('send');
                const chips = document.getElementById('chips');

                // Conversation state lives here and is sent with every request — the server
                // is stateless, so a restart mid-conversation loses nothing.
                let history = [];

                function bubble(text, who) {
                    const el = document.createElement('div');
                    el.className = 'msg ' + who;
                    el.textContent = text;
                    log.appendChild(el);
                    log.scrollTop = log.scrollHeight;
                    return el;
                }

                async function sendMessage(text) {
                    if (!text.trim()) return;

                    chips.style.display = 'none';
                    bubble(text, 'user');
                    input.value = '';
                    input.disabled = send.disabled = true;

                    const pending = bubble('typing…', 'bot');
                    pending.classList.add('typing');

                    try {
                        const res = await fetch('/api/chat', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ message: text, history })
                        });

                        const data = await res.json();
                        pending.classList.remove('typing');
                        pending.textContent = data.reply;
                        history = data.history;
                    } catch (err) {
                        pending.classList.remove('typing');
                        pending.textContent = "Sorry, I couldn't reach the clinic system. Please try again.";
                    } finally {
                        input.disabled = send.disabled = false;
                        input.focus();
                    }
                }

                send.onclick = () => sendMessage(input.value);
                input.onkeydown = e => { if (e.key === 'Enter') sendMessage(input.value); };
                chips.onclick = e => {
                    if (e.target.classList.contains('chip')) sendMessage(e.target.textContent);
                };

                bubble("Hi! I'm the receptionist at Bright Smile Dental. How can I help you today?", 'bot');
                input.focus();
    </script>
</body>
</html>
